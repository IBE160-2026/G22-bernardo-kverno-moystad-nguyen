[project]
name = "nabolagshelten"
version = "0.1.0"
description = "Nabolagshelten – småjobber i nabolaget (IBE160, G22)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.165.0",
    "starlette>=1.10.0,<2",
    "uvicorn~=0.54.0",
    "jinja2~=3.1.6",
    "python-multipart==0.0.34",
    "sqlalchemy~=2.1.9",
    "alembic~=1.20.1",
    "psycopg[binary]~=3.3.9",
    "pydantic~=2.14.4",
    "pydantic-settings~=2.16.3",
    "itsdangerous~=2.2.0",
]

[dependency-groups]
dev = [
    "pytest~=9.2.0",
    "httpx~=0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    # Starlette 1.10 anbefaler httpx2 for TestClient. Arkitekturen bruker httpx 0.28 (AR-2).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
