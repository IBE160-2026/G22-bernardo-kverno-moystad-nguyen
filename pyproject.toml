[project]
name = "nabolagshelten"
version = "0.1.0"
description = "Nabolagshelten – småjobber i nabolaget (IBE160, G22)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.165.0",
    "starlette>=1.10.0,<2",
    "uvicorn~=0.54.0",
    "jinja2~=3.1.6",
    "python-multipart==0.0.34",
    "sqlalchemy~=2.1.9",
    "alembic~=1.20.1",
    "psycopg[binary]~=3.3.9",
    "pydantic~=2.14.4",
    "pydantic-settings~=2.16.3",
    "itsdangerous~=2.2.0",
    "bcrypt~=5.0.0",
    "tzdata>=2026.6",
    "pillow~=13.0.0",
]

[dependency-groups]
dev = [
    "pytest~=9.2.0",
    "httpx~=0.28.1",
    "playwright~=1.65.2",
    "pytest-playwright~=0.10.0",
    "axe-playwright-python~=0.1.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# T1 (Playwright og axe) har markøren e2e og trenger en nettleser. Vanlig
# `uv run pytest` hopper over den, så README-kommandoen virker på en ren maskin
# (NFR-1). T1 kjøres med `uv run pytest -m e2e` (SM-5).
addopts = "-ra -m \"not e2e\""
markers = [
    "e2e: T1, ende-til-ende i ekte nettleser med Playwright og axe (SM-5, NFR-6, NFR-7)",
]
filterwarnings = [
    # Starlette 1.10 anbefaler httpx2 for TestClient. Arkitekturen bruker httpx 0.28 (AR-2).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # pytest-playwright 0.10 definerer sin `base_url`-fixtur som metode i en klasse.
    # Advarselen gjelder pluginen, ikke testene våre (AR-29).
    "ignore:Session-scoped fixtures defined as instance methods are deprecated",
]
