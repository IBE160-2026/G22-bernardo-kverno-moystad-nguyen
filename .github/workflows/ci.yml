# CI for Nabolagshelten (AR-7, NFR-3, AD-13).
# Kjører på hver PR og på push til main: pytest mot SQLite og Postgres,
# ett Alembic-hode, T1 (Playwright og axe, SM-5) og gitleaks over hele historikken. deploy.yml kaller den
# også (workflow_call) før publisering, så bare testet kode når produksjon.
# Bruker aldri pull_request_target, og jobbene trenger ingen hemmeligheter.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-sqlite:
    name: pytest (SQLite) og alembic heads
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.13"
          enable-cache: true
      - name: Installer avhengigheter
        run: uv sync --locked
      - name: Kjør testene
        run: uv run pytest
      - name: Nøyaktig ett Alembic-hode
        run: |
          uv run alembic heads | tee heads.txt
          test "$(grep -c . heads.txt)" -eq 1

  test-postgres:
    name: pytest (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nabolagshelten_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/nabolagshelten_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.13"
          enable-cache: true
      - name: Installer avhengigheter
        run: uv sync --locked
      - name: Kjør testene mot Postgres
        run: uv run pytest

  t1:
    # T1: universell utforming og JavaScript i ekte nettleser (SM-5, NFR-6, NFR-7).
    # Mot SQLite; serveren og databasen lages av tests/e2e/conftest.py.
    name: T1 (Playwright og axe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.13"
          enable-cache: true
      - name: Installer avhengigheter
        run: uv sync --locked
      - name: Installer Chromium
        run: uv run playwright install --with-deps chromium
      - name: Kjør T1
        run: uv run pytest -m e2e

  gitleaks:
    name: gitleaks (hele historikken)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Godta repoet som trygg git-mappe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Skann med gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose
