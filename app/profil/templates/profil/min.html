{% extends "core/base.html" %}
{% import "core/makroer.html" as m with context %}
{# Egen profil (FR-21, FR-2). «Rediger profil» og «Slett konto» kommer i story 4.4 og 4.5. #}
{% block innhold %}
<div class="lesebredde">
  <h1>{{ bruker.visningsnavn }}</h1>
  {{ m.meldinger() }}
  <p class="sted">
    <svg class="ikon" aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-6.1-6.5-11a6.5 6.5 0 0 1 13 0c0 4.9-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>
    <span>{{ bruker.sted }}</span>
  </p>
  <form class="knapperad" method="post" action="{{ url_for('identity.logg_ut') }}">
    {{ m.csrf_felt() }}
    <button class="knapp knapp--sekundar" type="submit">Logg ut</button>
  </form>
</div>
{% endblock %}
